[package]
name = "canwetalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "monophonic pitch and formant shifter plugin"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["crates/controls", "crates/controls-window", "crates/skeuo", "xtask"]

[workspace.dependencies]
# the one place the crate of unstyled controls is named: everything else writes `controls`
controls = { path = "crates/controls" }
# and the one place its window is: everything else writes `controls_window`
controls-window = { path = "crates/controls-window" }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl"] }

[lib]
# the plugin hosts load, and a library for the program below to build on
crate-type = ["cdylib", "lib"]

# the plugin as its own program, for looking at the editor without a host: `just editor`
[[bin]]
name = "canwetalk"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nice-plug/standalone"]

[dependencies]
# fades and filters decay into denormals on silence, which the wrapper flushes to zero
nice-plug = { version = "0.4.2", features = ["unsafe_flush_denormals"] }
# the editor's window, whose handles the wrapper is given
baseview = "0.4.2"
controls.workspace = true
controls-window.workspace = true
skeuo = { path = "crates/skeuo" }

# the audio code is too slow to try out unoptimized
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
