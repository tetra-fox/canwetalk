[package]
name = "canwetalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "monophonic pitch and formant shifter plugin"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["crates/skeuo", "xtask"]

[workspace.dependencies]
wgpu = { version = "27", default-features = false, features = ["std", "wgsl"] }

[lib]
# the plugin hosts load, and a library for the program below to build on
crate-type = ["cdylib", "lib"]

# the plugin as its own program, for looking at the editor without a host: `just editor`
[[bin]]
name = "canwetalk"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nice-plug/standalone"]

[dependencies]
# fades and filters decay into denormals on silence, which the wrapper flushes to zero
nice-plug = { version = "0.4.2", features = ["unsafe_flush_denormals"] }
# the editor's window, which it draws on and takes its input from
baseview = "0.4.2"
# the system's clipboard, which baseview only writes and only on macos. without its default
# features it carries text alone
arboard = { version = "3", default-features = false }
# the keys baseview reports, in the version it reports them with
keyboard-types = "0.8"
# waits for the graphics adapter and device while the window opens
pollster = "0.4"
skeuo = { path = "crates/skeuo" }
# the editor makes the surface and device skeuo draws with, so it picks the backends. the gl
# one is left out: it cannot build skeuo's shaders, which read a depth texture by texel
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan"] }

# the audio code is too slow to try out unoptimized
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
