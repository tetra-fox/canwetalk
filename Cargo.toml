[package]
name = "canwetalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "monophonic pitch and formant shifter plugin"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["xtask"]

[lib]
# the plugin hosts load, and a library for the program below to build on
crate-type = ["cdylib", "lib"]

# the plugin as its own program, for looking at the editor without a host: `just editor`
[[bin]]
name = "canwetalk"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nice-plug/standalone"]

[dependencies]
# fades and filters decay into denormals on silence, which the wrapper flushes to zero
nice-plug = { version = "0.4.2", features = ["unsafe_flush_denormals"] }
# the editor's crates, from a checkout of the potpot repository next to this one
potpot = { path = "../potpot/crates/potpot" }
potpot-controls = { path = "../potpot/crates/potpot-controls" }
potpot-window = { path = "../potpot/crates/potpot-window" }

# the audio code is too slow to try out unoptimized
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
