[package]
name = "canwetalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "monophonic pitch and formant shifter plugin"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["xtask"]

[lib]
# the plugin hosts load, and a library for the program below to build on
crate-type = ["cdylib", "lib"]

# the plugin as its own program, for looking at the editor without a host: `just editor`
[[bin]]
name = "canwetalk"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nice-plug/standalone"]

[dependencies]
# fades and filters decay into denormals on silence, which the wrapper flushes to zero
nice-plug = { version = "0.4.2", features = ["unsafe_flush_denormals"] }
# the editor's crates
potpot = { git = "https://github.com/tetra-fox/potpot", branch = "main" }
potpot-controls = { git = "https://github.com/tetra-fox/potpot", branch = "main" }
potpot-window = { git = "https://github.com/tetra-fox/potpot", branch = "main" }
# the fourier transform the editor's spectrum is taken with
realfft = "3.5.1"

[dev-dependencies]
# writes the picture of the editor a test draws
png = "0.18"

# the audio code is too slow to try out unoptimized
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
